<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>standin review</title>
<style>
:root {
  --bg: #e9eeec; --panel: #f7f9f8; --ink: #1d2624; --muted: #5d6a66; --line: #c9d3cf;
  --lit: #d9932b; --lit-ink: #6b430b; --life: #2f8f83; --dark-node: #8a948f; --danger: #a8322a; --focus: #2f6fb3;
  --bark: #7a6f5f; --ground: #dde4df;
  --ui: "Avenir Next", "Seravek", "Segoe UI", system-ui, sans-serif;
  --read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14201c; --panel: #1b2925; --ink: #e4ece8; --muted: #9db0a9; --line: #2f413b;
    --lit: #f0b452; --lit-ink: #f6d39a; --life: #4fbfb0; --dark-node: #5f6e69; --danger: #ef7a6f; --focus: #7fb2ec;
    --bark: #a39782; --ground: #1a2823; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--ui); display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
kbd { font: 12px var(--ui); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 8px; }
input, select, textarea { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px 10px; }
textarea { width: 100%; min-height: 88px; resize: vertical; }
input[type="checkbox"] { min-height: 0; width: 18px; height: 18px; margin: 0; flex: none; align-self: center; }

header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .01em; }
nav { display: flex; gap: 4px; }
nav button { border: none; background: transparent; color: var(--muted); padding: 0 12px; }
nav button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--lit); border-radius: 0; }
.progress { margin-left: auto; color: var(--muted); font-size: 14px; }
#banner { display: none; margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--lit); color: var(--lit-ink); }
#banner button { min-height: 32px; margin-left: 12px; }
main { flex: 1; min-height: 0; display: flex; }
section[hidden] { display: none !important; }

/* Session */
#session, #add { flex: 1; overflow: auto; padding: 32px 16px; }
.card { max-width: 40rem; margin: 0 auto; }
.topic { color: var(--muted); font-size: 15px; }
.topic b { color: var(--ink); font-weight: 600; }
.kind { font-size: 13px; color: var(--muted); margin-left: 6px; }
.concept { font: 600 clamp(26px, 4vw, 36px)/1.2 var(--ui); margin: 10px 0 8px; letter-spacing: -.01em; }
.definition { font: 400 clamp(19px, 2.4vw, 23px)/1.45 var(--read); margin: 0 0 18px; }
.skip { margin-top: 14px; }
.skip button { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions button { flex: 1 1 110px; white-space: nowrap; }
.note { color: var(--muted); font-size: 15px; margin: 4px 0 18px; }
.statement { font: 400 22px/1.4 var(--read); margin: 10px 0 14px; }
.includes { margin: -6px 0 18px; font-size: 15px; line-height: 1.5; }
.includes b { font-weight: 600; margin-right: 4px; }
.statements { list-style: none; padding: 0; margin: 0 0 18px; }
.intro-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.intro-row input { flex: 1; min-width: 12rem; }
.intro-row .small, .card .small { color: var(--muted); font-size: 13px; }
.filebtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.filebtn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.links { margin-top: 12px; display: grid; gap: 6px; }
.links label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.links button { justify-self: start; }
.sources { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--line); }
.sources li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.status-line { color: var(--muted); font-size: 14px; min-height: 1.5em; margin: 10px 0 0; }
.group { font-size: 15px; font-weight: 600; margin: 22px 0 8px; overflow-wrap: anywhere; }
.statements li { display: block; margin-bottom: 14px; }
.st-row { display: flex; gap: 8px; align-items: flex-start; }
.st-row textarea { flex: 1; min-width: 0; min-height: 0; resize: vertical; }
.st-meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.st-meta select, .st-meta button { min-height: 34px; font-size: 14px; }
.quote { margin: 8px 0 0; font-style: italic; }
.why { color: var(--muted); font-size: 15px; margin: 0 0 18px; padding-left: 14px; border-left: 2px solid var(--line); border-radius: 0; }
.done { text-align: center; padding-top: 10vh; }
.error { color: var(--danger); font-size: 14px; margin-top: 8px; }

/* Ask, and the self-quiz */
#ask { flex: 1; overflow: auto; padding: 32px 16px; }
.ask-row { display: flex; gap: 8px; margin: 14px 0 6px; }
.ask-row input { flex: 1; min-width: 0; min-height: 44px; }
.exchange { margin-top: 28px; }
.asked { color: var(--muted); font-size: 15px; margin: 0 0 8px; }
.reply { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.reply p { font: 400 20px/1.45 var(--read); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.badge { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.grounded { border-color: var(--lit); color: var(--lit-ink); }
.badge.inferred { border: 1px dashed var(--lit); color: var(--lit-ink); }
.badge.deflected { border-color: var(--life); color: var(--life); }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); max-width: 100%; overflow-wrap: anywhere; }
.chip i { font-style: normal; color: var(--muted); }
details.work { margin-top: 10px; font-size: 14px; color: var(--muted); }
details.work summary { cursor: pointer; padding: 6px 0; }
details.work ul { margin: 6px 0 0; padding-left: 18px; }
details.work li { margin: 2px 0; overflow-wrap: anywhere; }
.yours { font: 400 18px/1.45 var(--read); margin: 6px 0 18px; padding-left: 14px; border-left: 2px solid var(--line); border-radius: 0; }
.label-small { font-size: 13px; color: var(--muted); margin: 18px 0 4px; }

/* Forest */
#forestTab { flex: 1; display: flex; min-width: 0; position: relative; }
#canvas { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#forest { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#forest.panning { cursor: grabbing; }
.tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.tools label { display: flex; align-items: center; gap: 6px; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 44px; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.legend svg { vertical-align: -3px; margin-right: 4px; }
.soil { fill: var(--ground); }
.groundline { stroke: var(--bark); stroke-width: 1.2; opacity: .5; }
.bark { fill: none; stroke: var(--bark); stroke-linecap: round; }
.bud { fill: var(--bg); stroke: var(--bark); stroke-width: 1.4; }
.trunk { cursor: zoom-in; }
.treename { font: 600 17px var(--read); fill: var(--ink); letter-spacing: .01em; }
.vine { fill: none; stroke: var(--life); stroke-width: 1.2; stroke-dasharray: 2 4; }
.label { font: 13px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.label.unlit, .label.frontier { fill: var(--muted); }
.label.minor { opacity: 0; transition: opacity .15s; }
.near .label.minor, .tree.focus .label.minor, .node:hover .label.minor, .node:focus-visible .label.minor, .node.selected .label.minor { opacity: 1; }
#forest .label.crowded { opacity: 0; }
#forest .node:hover .label.crowded, #forest .node:focus-visible .label.crowded, #forest .node.selected .label.crowded { opacity: 1; }
.node { cursor: pointer; outline: none; }
.node:focus-visible circle.core { stroke: var(--focus); stroke-width: 3; }
.node.selected .label { font-weight: 600; }
.node.selected circle.core { stroke: var(--ink); stroke-width: 2; }
.node.target circle.core, .trunk.target .bark { stroke: var(--focus); }
.node.target circle.core { stroke-width: 3; }
.halo { fill: var(--lit); }
#ghost { position: fixed; pointer-events: none; padding: 4px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 14px; display: none; z-index: 5; }

#panel { width: 380px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 18px 18px 40px; }
#panel h2 { font-size: 20px; margin: 0 0 2px; }
#panel h3 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; color: var(--muted); }
#panel .status { color: var(--muted); margin: 0 0 8px; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { padding: 8px 0; border-bottom: 1px solid var(--line); }
#panel li:last-child { border-bottom: none; }
#panel .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
#panel .row > input, #panel .row > select { flex: 1 1 140px; min-width: 0; }
#panel .path { font-size: 15px; }
#panel .small { font-size: 13px; color: var(--muted); }
#panel .close { float: right; min-height: 36px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* Lists */
.list { flex: 1; overflow: auto; padding: 24px 16px; }
.list > div { max-width: 44rem; margin: 0 auto; }
.list li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list ul { list-style: none; padding: 0; margin: 0; }

@media (max-width: 760px) {
  #panel { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; border-left: none; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  .legend { font-size: 12px; gap: 8px; padding: 6px 10px; right: 12px; }
  header { gap: 8px; }
  nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  nav { gap: 0; }
  nav button { padding: 0 8px; flex: none; }
  .progress { margin-left: 0; width: 100%; order: 3; }
}
@media (prefers-reduced-motion: no-preference) {
  .halo { transition: opacity .3s; }
  /* The one moment of motion: the first time the forest opens, it grows from the trunk outward. */
  .grow .branch, .grow .node { animation: grow .5s both; animation-delay: calc(var(--d) * 110ms); }
  @keyframes grow { from { opacity: 0; } }
}
</style>
</head>
<body>
<header>
  <h1>standin review</h1>
  <nav role="tablist">
    <button role="tab" data-tab="session" aria-selected="true">Questions</button>
    <button role="tab" data-tab="add" aria-selected="false">Add</button>
    <button role="tab" data-tab="ask" aria-selected="false">Ask</button>
    <button role="tab" data-tab="forest" aria-selected="false">Forest</button>
    <button role="tab" data-tab="boundaries" aria-selected="false">Boundaries</button>
  </nav>
  <span class="progress" id="progress"></span>
</header>
<div id="banner" role="status"><span id="bannerText"></span><button id="bannerClose" class="ghost">Dismiss</button></div>
<main>
  <section id="session" role="tabpanel"></section>
  <section id="add" role="tabpanel" hidden></section>
  <section id="ask" role="tabpanel" hidden></section>
  <section id="forestTab" role="tabpanel" hidden>
    <div id="canvas">
      <svg id="forest" aria-label="Your forest: one tree for each part of your world"></svg>
      <div class="tools">
        <button id="fit">Fit</button>
        <label><input type="checkbox" id="frontier"> Show unexplored</label>
      </div>
      <div class="legend" aria-hidden="true">
        <span><svg width="16" height="16"><circle style="fill:var(--lit)" cx="8" cy="8" r="7" opacity=".35"/><circle style="fill:var(--lit)" cx="8" cy="8" r="5"/></svg>you know it (brighter = deeper)</span>
        <span><svg width="16" height="16"><circle style="fill:var(--lit);stroke:var(--lit)" cx="8" cy="8" r="6" fill-opacity=".4" stroke-dasharray="2 2" stroke-width="1.5"/></svg>guessed (fill = how likely)</span>
        <span><svg width="16" height="16"><circle style="fill:var(--life)" cx="8" cy="8" r="6"/></svg>has facts</span>
        <span><svg width="16" height="16"><circle style="fill:var(--dark-node)" cx="8" cy="8" r="6"/></svg>you don't know it</span>
        <span><svg width="16" height="16"><circle style="stroke:var(--dark-node)" cx="8" cy="8" r="5.5" fill="none" stroke-width="1.5"/></svg>not asked yet</span>
      </div>
    </div>
    <aside id="panel" hidden></aside>
    <div id="ghost"></div>
  </section>
  <section id="boundaries" class="list" role="tabpanel" hidden><div></div></section>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Standin-Token": TOKEN, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function banner(text) {
  if (!text) return;
  $("#bannerText").textContent = text;
  $("#banner").style.display = "block";
}
$("#bannerClose").onclick = () => ($("#banner").style.display = "none");

// ---- tabs ---------------------------------------------------------------------
let tab = "session";
function show(name) {
  tab = name;
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  $("#session").hidden = name !== "session";
  $("#add").hidden = name !== "add";
  $("#ask").hidden = name !== "ask";
  $("#forestTab").hidden = name !== "forest";
  $("#boundaries").hidden = name !== "boundaries";
  if (name === "session") loadCard();
  if (name === "add") renderIntro();
  if (name === "ask") renderAsk();
  if (name === "forest") loadForest(true);
  if (name === "boundaries") loadBoundaries();
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => show(b.dataset.tab);

// ---- the session: one concept at a time ----------------------------------------------
let card = null;
let keymap = {};
const LEVELS = [[4, "Expert"], [3, "Know well"], [2, "Used it"], [1, "Heard of it"], [0, "No"]];
const LEVEL_NAME = Object.fromEntries(LEVELS.map(([l, n]) => [l, n]));
const WHY = {
  guess: "We guessed you probably know this.",
  part: (parent) => `A part of ${esc(parent)}.`,
  area: "An area you haven't told us about yet.",
};

// The introduction is needed until the standin knows something about you (or you skip it).
let introNeeded = false;
// Whether a card was answered on this page, so running out of questions can open the forest.
let answeredHere = false;

async function loadCard() {
  try {
    const data = await api("/api/card");
    card = data.card;
    if (data.warnings?.length) banner(data.warnings.join(" · "));
    introNeeded = card?.type === "intro";
    if (introNeeded && tab === "session") return show("add");
    if (card?.type === "done" && answeredHere) {
      answeredHere = false;
      banner("No more questions for now. Here is your forest.");
      renderCard();
      return show("forest");
    }
    renderCard();
    const st = await api("/api/status");
    quizStatus = st.quiz;
    $("#progress").textContent = `${st.answered} answered${st.quiz?.score != null ? ` · self-quiz agreement ${Math.round(st.quiz.score * 100)}%` : ""}`;
  } catch (e) {
    $("#session").innerHTML = `<div class="card"><p class="error">${esc(e.message)}</p></div>`;
  }
}

function buttons(list) {
  keymap = {};
  return `<div class="actions">${list
    .map(([label, key, id, cls]) => {
      if (key) keymap[key] = id;
      return `<button id="${id}" class="${cls || ""}">${esc(label)}${key ? `<kbd>${key}</kbd>` : ""}</button>`;
    })
    .join("")}</div><div class="error" id="cardError"></div>`;
}

async function act(fn) {
  try {
    await fn();
    answeredHere = true;
    await loadCard();
  } catch (e) {
    const el = $("#cardError");
    if (el) el.textContent = e.message;
  }
}

function renderCard() {
  const root = $("#session");
  const c = card;
  keymap = {};
  if (!c) return;
  if (c.type === "intro") {
    root.innerHTML = `<div class="card done"><p class="statement">Start by introducing yourself.</p><p class="note">Your standin asks better questions once it knows a little about you.</p>${buttons([["Introduce yourself", "", "toAdd", "primary"]])}</div>`;
    $("#toAdd").onclick = () => show("add");
    return;
  }
  if (c.type === "card") {
    const k = c.card;
    const why = k.reason === "part" ? WHY.part(k.parent) : WHY[k.reason];
    root.innerHTML = `<div class="card">
      <div class="topic">${k.path.map(esc).join(" › ")}</div>
      <h2 class="concept">${esc(k.topic)}</h2>
      ${k.definition && k.definition !== k.topic ? `<p class="definition">${esc(k.definition)}</p>` : ""}
      ${k.examples.length ? `<p class="includes"><b>Includes</b>${k.examples.map(esc).join(", ")}</p>` : ""}
      ${k.why ? `<p class="why">Why we guessed: ${esc(k.why)}</p>` : ""}
      <p class="note">${why} How well do you know it?</p>
      ${buttons([...LEVELS.map(([l, n]) => [n, String(l), `l${l}`]), ["Wouldn't say", "w", "lw", "ghost"]])}
      ${k.reason === "part" ? `<div class="skip"><button id="skip" class="ghost">Skip the rest of ${esc(k.parent)}<kbd>s</kbd></button></div>` : ""}
    </div>`;
    const answer = (a) => act(() => api("/api/answer", { responseId: k.responseId, answer: a }));
    for (const [l] of LEVELS) $(`#l${l}`).onclick = () => answer(l);
    $("#lw").onclick = () => answer("wouldnt_say");
    if (k.reason === "part") {
      keymap.s = "skip";
      $("#skip").onclick = () => act(() => api("/api/skip", { parentId: k.parentId }));
    }
  } else if (c.type === "question") {
    return renderQuestion(c.question);
  } else if (c.type === "quiz") {
    return renderQuiz(c.quiz);
  } else if (c.type === "keep-lower") {
    const d = c.decision;
    root.innerHTML = `<div class="card">
      <h2 class="concept">${esc(d.topic)}</h2>
      <p class="statement">You said you know ${esc(d.topic)} at “${esc(LEVEL_NAME[d.claimed])}”.</p>
      <p class="why">You rated these parts lower: ${d.lower.map((l) => `${esc(l.topic)} (${esc(LEVEL_NAME[l.level])})`).join(", ")}</p>
      <p class="note">Keep your claim with those parts carved out, or lower it to “${esc(LEVEL_NAME[Math.min(...d.lower.map((l) => l.level))])}”.</p>
      ${buttons([["Keep", "k", "keep"], ["Lower", "l", "lower"]])}
    </div>`;
    $("#keep").onclick = () => act(() => api("/api/claim", { claimNodeId: d.claimNodeId, choice: "keep" }));
    $("#lower").onclick = () => act(() => api("/api/claim", { claimNodeId: d.claimNodeId, choice: "lower" }));
  } else if (c.type === "proposal") {
    const it = c.item;
    const extra = [
      it.reasons.length ? `why: ${it.reasons.map(esc).join("; ")}` : "",
      it.replaces ? `replaces: “${esc(it.replaces)}”` : "",
      it.conflictsWith ? `conflicts with: “${esc(it.conflictsWith)}”` : "",
    ].filter(Boolean);
    root.innerHTML = `<div class="card">
      <div class="topic">${it.stillTrue ? "<b>Still true?</b>" : `<b>${esc(it.memoryKind)}</b> · ${esc(it.group)}`}</div>
      <p class="statement" id="stmt">${esc(it.statement)}</p>
      ${extra.length ? `<p class="why">${extra.join("<br>")}</p>` : ""}
      ${it.stillTrue ? buttons([["Still true", "k", "keep"], ["No longer", "x", "expire"]]) : buttons([["Approve", "a", "approve", "primary"], ["Edit, then approve", "e", "edit"], ["Reject", "r", "reject"]])}
    </div>`;
    const decide = (decision, statement) => act(() => api("/api/decide", { id: it.id, decision, statement }));
    if (it.stillTrue) {
      $("#keep").onclick = () => decide("keep");
      $("#expire").onclick = () => decide("expire");
    } else {
      $("#approve").onclick = () => decide("approve");
      $("#reject").onclick = () => decide("reject");
      $("#edit").onclick = () => {
        $("#stmt").outerHTML = `<input id="stmtEdit" style="width:100%;margin:10px 0 14px" value="${esc(it.statement)}" aria-label="Statement">`;
        const input = $("#stmtEdit");
        input.focus();
        input.onkeydown = (e) => { if (e.key === "Enter" && input.value.trim()) decide("approve", input.value.trim()); };
        $("#edit").textContent = "Approve edit";

// ---- asking as a visitor would, and the self-quiz ----------------------------------------------------------
let quizStatus = null;
const asked = [];
const STATE_NAME = { grounded: "On record", inferred: "Inferred, hedged", not_on_record: "Not on record", deflected: "Kept private" };
const LEFT_OUT = { status: "not approved yet", tier: "private (tier 3 or 4)", boundary: "in a branch you keep private", expired: "out of date", budget: "over the limit" };

/** A reply the way a visitor sees it: the text, its state, what it rests on; then how it decided, folded away. */
function replyView(r) {
  const w = r.work;
  const left = {};
  for (const f of w.filtered) left[f.reason] = (left[f.reason] || 0) + 1;
  const model = w.checks.model === null ? "not needed" : typeof w.checks.model === "string" ? w.checks.model : w.checks.model.supported ? "every claim is in the cited facts" : `unsupported: ${w.checks.model.unsupported.join("; ")}`;
  const why = r.reason === "competence" ? " (not a topic you know well)" : r.reason === "check" ? " (a check stopped the reply)" : "";
  return `<div class="reply"><p>${esc(r.text)}</p>
    <div class="meta"><span class="badge ${r.state}">${STATE_NAME[r.state]}</span>${r.cites.map((c) => `<span class="chip">${esc(c.statement)} <i>${esc(c.node)}</i></span>`).join("")}</div></div>
    <details class="work"><summary>How it answered${esc(why)}</summary><ul>
      <li>Looked in: ${w.seeds.length ? w.seeds.map((s) => esc(s.name)).join(", ") : "nothing in your tree matched"}</li>
      <li>Could use: ${w.context.length ? w.context.map((c) => esc(c.text)).join(" · ") : "nothing"}</li>
      <li>Left out: ${Object.keys(left).length ? Object.entries(left).map(([k, n]) => `${n} ${LEFT_OUT[k]}`).join(", ") : "nothing"}</li>
      <li>Checks: ${w.checks.code === null && w.checks.model === null ? "not needed for a fixed reply" : `${esc(w.checks.code ?? "rules passed")}; ${esc(model)}`}</li>
      ${w.rejected ? `<li>Stopped reply: ${esc(w.rejected)}</li>` : ""}
      <li>${w.modelCalls} model call${w.modelCalls === 1 ? "" : "s"}, $${w.costUsd.toFixed(4)}, ${(w.ms / 1000).toFixed(1)}s</li>
    </ul></details>`;
}

}) {
  const all = new Map();
  const row = (st) => {
    all.set(st.id, st);

    return `<li data-st="${esc(st.id)}">
      <div class="st-row"><textarea rows="2" maxlength="500" aria-label="Statement">${esc(st.statement)}</textarea><button class="ghost remove">Remove</button></div>

      <p class="why quote" hidden>“${esc(st.quote)}”</p>
    </li>`;
  };
  const total = reading.groups.reduce((n, g) => n + g.statements.length, 0);
  const left = [
    reading.notFound ? `${reading.notFound} couldn't be found in the source` : "",
    reading.sensitive ? `${reading.sensitive} touched a sensitive subject` : "",
    reading.contacts ? `${reading.contacts} contact detail${reading.contacts === 1 ? " was" : "s were"} removed` : "",
    reading.overLimit ? `${reading.overLimit} more past the limit of 40 (confirm these, then add the rest again)` : "",
  ].filter(Boolean);
  $(o.into).innerHTML = `<div class="card">
    <h2 class="concept">Is this right?</h2>
    <p class="note">This is what your standin read, with the words each statement rests on. Fix, re-kind or remove anything; only what you keep is saved.</p>
    ${reading.groups.map((g) => `<h3 class="group">${esc(SOURCE_KIND[g.kind])} · ${esc(g.ref)}</h3>${g.statements.length ? `<ul class="statements">${g.statements.map(row).join("")}</ul>` : `<p class="small">Nothing to keep was found here.</p>`}`).join("")}
    ${left.length ? `<p class="why">Left out: ${left.join("; ")}.</p>` : ""}
    <div class="actions"><button id="confirmIntro" class="primary"${total ? "" : " disabled"}>Looks right</button><button id="backIntro" class="ghost">Back</button></div>
    <div class="error" id="cardError"></div>
  </div>`;
  for (const b of document.querySelectorAll(".statements .remove")) b.onclick = () => b.closest("li").remove();
  for (const b of document.querySelectorAll(".quote-toggle"))
    b.onclick = () => {
      const q = b.closest("li").querySelector(".quote");
      q.hidden = !q.hidden;
      b.setAttribute("aria-expanded", String(!q.hidden));
    };
  $("#backIntro").onclick = o.back;
  $("#confirmIntro").onclick = async () => {
    const kept = [...document.querySelectorAll(".statements li")]
      .map((li) => {
        const st = all.get(li.dataset.st);
        const kind = li.querySelector("select").value;
        return { sourceId: st.sourceId, statement: li.querySelector("textarea").value.trim(), quote: st.quote, kind, kindLabel: kind === "other" ? st.kindLabel : null, start: st.start, end: st.end, current: st.current };
      })
      .filter((s) => s.statement);
    if (!kept.length) return ($("#cardError").textContent = "Keep at least one statement, or go back.");
    $("#confirmIntro").disabled = true;
    $("#confirmIntro").textContent = o.busy;

      const r = await o.send(kept);

      o.done();

      $("#cardError").textContent = e.message;
      $("#confirmIntro").disabled = false;
      $("#confirmIntro").textContent = "Looks right";
    }
  };
}

// ---- the forest, drawn as a grove: six trees on one ground line (review-page spec §4) -------------
const SVGNS = "http://www.w3.org/2000/svg";
const FAN_FROM = (200 * Math.PI) / 180, FAN_TO = (340 * Math.PI) / 180;
const RING = 74, LEAF = 7, TREE_GAP = 50, NEAR = 1.1;
let forest = null;
let selected = null;
let focusTree = null;
let view = { x: 40, y: 40, k: 1 };
let grove = null;
let grown = false;

/** Loads and draws the grove; `refit` frames it all again (on opening the tab, not after an edit). */
async function loadForest(refit = false) {
  try {
    forest = await api("/api/forest");
    drawForest();
    if (refit) firstView();
    if (selected) openPanel(selected);
  } catch (e) {
    banner(e.message);
  }
}
$("#frontier").onchange = drawForest;

/** A small, stable number in [-1, 1] from a node's id, so each tree bends its own way and always the same way. */
function wobble(id) {
  let h = 2166136261;
  for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return ((h >>> 0) % 2001) / 1000 - 1;
}

const branchWidth = (size) => Math.min(16, 1.5 + 1.3 * Math.sqrt(size));

/** Every tree's layout: its trunk, and each node's place on a fan above it, in one coordinate space (the ground is y = 0). */
function growGrove() {
  const showFrontier = $("#frontier").checked;
  const visible = forest.nodes.filter((n) => showFrontier || !n.frontier);
  const byId = new Map(visible.map((n) => [n.id, n]));
  const rootIds = new Set(forest.roots.map((r) => r.id));
  const kids = new Map();
  const loose = [];
  for (const n of visible) {
    if (n.parentId && (byId.has(n.parentId) || rootIds.has(n.parentId))) kids.set(n.parentId, [...(kids.get(n.parentId) || []), n]);
    else loose.push(n);
  }
  for (const list of kids.values()) list.sort((a, b) => a.name.localeCompare(b.name));
  const trees = forest.roots.map((r) => ({ id: r.id, name: r.name, root: true }));
  if (loose.length) {
    trees.push({ id: "__loose", name: "Not placed yet", root: false });
    kids.set("__loose", loose.sort((a, b) => a.name.localeCompare(b.name)));
  }
  const leaves = new Map(), size = new Map(), depthOf = new Map();
  const measure = (id, depth, seen) => {
    if (seen.has(id)) return 0;
    seen.add(id);
    depthOf.set(id, depth);
    const cs = kids.get(id) || [];
    let l = 0, s = 1;
    for (const c of cs) {
      l += measure(c.id, depth + 1, seen);
      s += size.get(c.id) || 0;
    }
    leaves.set(id, Math.max(1, l));
    size.set(id, s);
    return Math.max(1, l);
  };
  const pos = new Map(), out = [];
  let cursor = 0;
  for (const t of trees) {
    const seen = new Set();
    measure(t.id, 0, seen);
    const nodes = [...seen].filter((id) => id !== t.id);
    const maxDepth = Math.max(0, ...nodes.map((id) => depthOf.get(id)));
    const ring = Math.max(RING, (26 * leaves.get(t.id)) / ((FAN_TO - FAN_FROM) * Math.max(1, maxDepth)));
    const trunk = nodes.length ? Math.min(150, 56 + 9 * Math.sqrt(nodes.length)) : 34;
    // Grow the tree around x = 0, then stand it next to the last one by the room its leaves (and their labels) take.
    const crown = { x: 0, y: -trunk };
    pos.set(t.id, { ...crown, angle: -Math.PI / 2 });
    const place = (id, from, to) => {
      const cs = kids.get(id) || [];
      const total = cs.reduce((n, c) => n + leaves.get(c.id), 0);
      let at = from;
      for (const c of cs) {
        const share = ((to - from) * leaves.get(c.id)) / total;
        const angle = at + share / 2 + wobble(c.id) * share * 0.12;
        const r = ring * depthOf.get(c.id) * (1 + wobble(c.id + "r") * 0.05);
        pos.set(c.id, { x: crown.x + Math.cos(angle) * r, y: crown.y + Math.sin(angle) * r, angle });
        place(c.id, at, at + share);
        at += share;
      }
    };
    place(t.id, FAN_FROM, FAN_TO);
    // Room for each leaf's label too, on the side it points to (about 7 px a character).
    const ext = nodes.map((id) => {
      const p = pos.get(id), w = 16 + 7 * (byId.get(id)?.name.length ?? 0);
      return Math.abs(Math.cos(p.angle)) < 0.2 || (kids.get(id) || []).length ? [p.x - w / 2, p.x + w / 2] : Math.cos(p.angle) >= -0.2 ? [p.x, p.x + w] : [p.x - w, p.x];
    });
    const left = nodes.length ? Math.min(-60, ...ext.map((e) => e[0])) - 20 : -55, right = nodes.length ? Math.max(60, ...ext.map((e) => e[1])) + 20 : 55;
    const x = cursor - left;
    for (const id of [t.id, ...nodes]) pos.get(id).x += x;
    const xs = nodes.map((id) => pos.get(id).x);
    out.push({ ...t, x, trunk, reach: [Math.min(x - 40, ...xs) - 30, Math.max(x + 40, ...xs) + 30], top: Math.max(trunk, ...nodes.map((id) => -pos.get(id).y)) + 40, left: cursor, right: cursor + right - left, nodes, size: size.get(t.id) });
    cursor += right - left + TREE_GAP;
  }
  return { trees: out, kids, pos, size, depthOf, byId, width: cursor - TREE_GAP, height: Math.max(...out.map((t) => t.top)) };
}

function el(name, attrs, parent) {
  const e = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    // Colour tokens are CSS variables, which presentation attributes don't resolve: set them as style.
    if ((k === "fill" || k === "stroke") && String(v).startsWith("var(")) e.style.setProperty(k, v);
    else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}

function nodeGlyph(g, n) {
  const knowledge = n.root === "knowledge" || (!n.root && n.label === "topic");
  if (n.frontier) return el("circle", { class: "core", r: 4, fill: "var(--bg)", stroke: "var(--dark-node)", "stroke-dasharray": "1.5 2" }, g);
  if (n.state === "lit" && knowledge) {
    const d = Math.max(1, Math.min(4, n.depth || 1));
    el("circle", { class: "halo", r: LEAF + d * 3, opacity: 0.08 + d * 0.05 }, g);
    return el("circle", { class: "core", r: LEAF, fill: "var(--lit)", "fill-opacity": 0.35 + 0.15 * d }, g);
  }
  if (n.state === "lit") return el("circle", { class: "core", r: LEAF, fill: "var(--life)" }, g);
  if (n.state === "probable") return el("circle", { class: "core", r: LEAF, fill: "var(--lit)", "fill-opacity": n.p ?? 0.5, stroke: "var(--lit)", "stroke-width": 1.6, "stroke-dasharray": "3 2.5" }, g);
  if (n.state === "dark") return el("circle", { class: "core", r: LEAF, fill: "var(--dark-node)" }, g);
  return el("circle", { class: "core", r: LEAF - 0.5, fill: "var(--bg)", stroke: "var(--dark-node)", "stroke-width": 1.6 }, g);
}

/** A branch that leaves its parent going up, then bends out toward its child. */
function branchPath(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  return `M${a.x},${a.y} C${a.x + dx * 0.15},${a.y + dy * 0.75} ${a.x + dx * 0.6},${b.y - dy * 0.08} ${b.x},${b.y}`;
}

function setView() {
  $("#world")?.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  $("#forest").classList.toggle("near", view.k >= NEAR);
}

function drawForest() {
  if (!forest) return;
  grove = growGrove();
  const svg = $("#forest");
  svg.innerHTML = "";
  const world = el("g", { id: "world" }, svg);
  if (!grown) {
    world.classList.add("grow");
    grown = true;
  }
  const { trees, kids, pos, size, depthOf, byId } = grove;
  el("rect", { class: "soil", x: -4000, y: 0, width: grove.width + 8000, height: 46 }, world);
  el("line", { class: "groundline", x1: -4000, y1: 0, x2: grove.width + 4000, y2: 0 }, world);
  for (const t of trees) {
    const g = el("g", { class: `tree${focusTree === t.id ? " focus" : ""}`, "data-tree": t.id }, world);
    const hit = el("g", { class: "trunk", ...(t.root ? { "data-root": t.id } : {}), "data-zoom": t.id }, g);
    if (!t.nodes.length) {
      // A sapling: a root with nothing in it yet.
      el("path", { class: "bark", d: `M${t.x},0 C${t.x - 2},-12 ${t.x + 2},-22 ${t.x},-${t.trunk}`, "stroke-width": 3 }, hit);
      el("ellipse", { class: "bud", cx: t.x - 7, cy: -t.trunk + 2, rx: 6, ry: 3.5, transform: `rotate(-30 ${t.x - 7} ${-t.trunk + 2})` }, hit);
      el("ellipse", { class: "bud", cx: t.x + 7, cy: -t.trunk - 2, rx: 6, ry: 3.5, transform: `rotate(30 ${t.x + 7} ${-t.trunk - 2})` }, hit);
    } else {
      const w = branchWidth(t.size);
      const bend = wobble(t.id) * 8;
      el("path", { class: "bark", d: `M${t.x},0 C${t.x + bend},${-t.trunk * 0.35} ${t.x - bend},${-t.trunk * 0.7} ${t.x},${-t.trunk}`, "stroke-width": w + 2 }, hit);
      el("path", { class: "bark", d: `M${t.x - w * 0.9},2 Q${t.x},-6 ${t.x + w * 0.9},2`, "stroke-width": 3 }, hit);
    }
    const label = el("text", { class: "treename", x: t.x, y: 28, "text-anchor": "middle" }, hit);
    label.textContent = t.name;
    // Branches, thickest first so thin twigs sit on top.
    const branches = [];
    const walk = (id) => {
      for (const c of kids.get(id) || []) {
        if (!pos.has(c.id)) continue;
        branches.push([id, c.id]);
        walk(c.id);
      }
    };
    walk(t.id);
    branches.sort(([, a], [, b]) => (size.get(b) || 0) - (size.get(a) || 0));
    for (const [from, to] of branches)
      el("path", { class: "bark branch", d: branchPath(pos.get(from), pos.get(to)), "stroke-width": branchWidth(size.get(to) || 1), style: `--d:${depthOf.get(to) || 1}` }, g);
    for (const id of t.nodes) {
      const n = byId.get(id), p = pos.get(id);
      if (!n || !p) continue;
      const depth = depthOf.get(id) || 1;
      const lg = el("g", { class: `node${selected === id ? " selected" : ""}`, "data-node": id, transform: `translate(${p.x},${p.y})`, tabindex: 0, role: "button", "aria-label": `${n.name}, ${n.state}`, style: `--d:${depth}` }, g);
      nodeGlyph(lg, n);
      // A leaf's name points away from the trunk; a fork's name sits under it, clear of the twigs growing out of it.
      const fork = (kids.get(id) || []).some((c) => pos.has(c.id));
      const right = Math.cos(p.angle) >= -0.2;
      const up = Math.abs(Math.cos(p.angle)) < 0.2;
      const text = el("text", {
        class: `label ${n.state}${n.frontier ? " frontier" : ""}${depth > 1 ? " minor" : ""}`,
        x: fork || up ? 0 : right ? 13 : -13,
        y: fork ? 22 : up ? -14 : 5,
        "text-anchor": fork || up ? "middle" : right ? "start" : "end",
      }, lg);
      text.textContent = n.name + (n.boundary ? " 🔒" : "");
    }
  }
  declutter(svg);
  // Cross-links only for the leaf you're looking at, as vines.
  if (selected && pos.has(selected))
    for (const l of forest.links) {
      if (l.from !== selected && l.to !== selected) continue;
      const a = pos.get(l.from), b = pos.get(l.to);
      if (a && b) el("path", { class: "vine", d: `M${a.x},${a.y} Q${(a.x + b.x) / 2},${Math.min(a.y, b.y) - 60} ${b.x},${b.y}` }, world);
    }
  setView();
}

/**
 * Hides a label that would sit on one already placed (hovering or focusing its leaf still shows it): first-ring
 * branches first, then what you know or we guessed, then the rest.
 */
function declutter(svg) {
  const rank = (g) => {
    const label = g.querySelector(".label");
    return [label.classList.contains("minor") ? 1 : 0, /\b(lit|probable)\b/.test(label.getAttribute("class")) ? 0 : 1];
  };
  const placed = [];
  const groups = [...svg.querySelectorAll(".node")].sort((a, b) => {
    const [x, y] = [rank(a), rank(b)];
    return x[0] - y[0] || x[1] - y[1];
  });
  for (const g of groups) {
    const label = g.querySelector(".label");
    const p = g.transform.baseVal.consolidate()?.matrix;
    const b = label.getBBox();
    const box = { x: b.x + (p?.e ?? 0) - 2, y: b.y + (p?.f ?? 0) - 1, w: b.width + 4, h: b.height + 2 };
    const hit = placed.some((o) => box.x < o.x + o.w && o.x < box.x + box.w && box.y < o.y + o.h && o.y < box.y + box.h);
    label.classList.toggle("crowded", hit);
    if (!hit) placed.push(box);
  }
}

/** Fits a box (in grove coordinates) into the canvas. */
function frame(left, right, top) {
  const box = $("#canvas").getBoundingClientRect();
  const below = $(".legend").getBoundingClientRect().height + 30;
  const w = right - left + 80, h = top + 90;
  const k = Math.max(0.2, Math.min(1.6, (box.width - 40) / w, (box.height - below - 70) / h));
  view = { k, x: (box.width - (right - left) * k) / 2 - left * k, y: box.height - below - 46 * k };
  setView();
}

/** On opening the tab: the whole grove, or on a narrow screen, the biggest tree (Fit still shows them all). */
function firstView() {
  const biggest = grove?.trees.filter((t) => t.nodes.length).sort((a, b) => b.nodes.length - a.nodes.length)[0];
  if (biggest && $("#canvas").getBoundingClientRect().width < 600) zoomToTree(biggest.id);
  else fit();
}

function fit() {
  if (!grove) return;
  focusTree = null;
  for (const t of document.querySelectorAll("#forest .tree")) t.classList.remove("focus");
  frame(0, grove.width, grove.height);
}
$("#fit").onclick = fit;

function zoomToTree(id) {
  const t = grove?.trees.find((x) => x.id === id);
  if (!t) return;
  focusTree = id;
  for (const g of document.querySelectorAll("#forest .tree")) g.classList.toggle("focus", g.getAttribute("data-tree") === id);
  frame(t.reach[0], t.reach[1], t.top);
}

// Pan, zoom, select, zoom to a tree, and drag a leaf onto another leaf or a tree to move it.
(() => {
  const svg = $("#forest");
  const pointers = new Map();
  let pan = null, drag = null, pinch = null;
  const target = (x, y) => {
    const hit = document.elementFromPoint(x, y)?.closest("[data-node],[data-root]");
    return hit ? hit.getAttribute("data-node") || hit.getAttribute("data-root") : null;
  };
  const mark = (id) => {
    for (const e of svg.querySelectorAll(".target")) e.classList.remove("target");
    if (id) svg.querySelector(`[data-node="${id}"],[data-root="${id}"]`)?.classList.add("target");
  };
  svg.addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
      pan = drag = null;
      return;
    }
    const node = e.target.closest("[data-node]");
    if (node) drag = { id: node.getAttribute("data-node"), x: e.clientX, y: e.clientY, moving: false };
    else pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, tree: e.target.closest("[data-zoom]")?.getAttribute("data-zoom") };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      view.k = Math.max(0.2, Math.min(3, pinch.k * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)));
      return setView();
    }
    if (pan) {
      if (Math.hypot(e.clientX - pan.x, e.clientY - pan.y) > 4) {
        pan.moved = true;
        svg.classList.add("panning");
      }
      view.x = pan.vx + e.clientX - pan.x;
      view.y = pan.vy + e.clientY - pan.y;
      setView();
    } else if (drag) {
      if (!drag.moving && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
        drag.moving = true;
        const ghost = $("#ghost");
        ghost.textContent = `Move ${forest.nodes.find((n) => n.id === drag.id)?.name}`;
        ghost.style.display = "block";
      }
      if (drag.moving) {
        const ghost = $("#ghost");
        ghost.style.left = `${e.clientX + 14}px`;
        ghost.style.top = `${e.clientY + 10}px`;
        const t = target(e.clientX, e.clientY);
        mark(t && t !== drag.id ? t : null);
      }
    }
  });
  const end = async (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    svg.classList.remove("panning");
    if (pan) {
      const p = pan;
      pan = null;
      if (!p.moved && p.tree) zoomToTree(p.tree);
      return;
    }
    if (!drag) return;
    const d = drag;
    drag = null;
    $("#ghost").style.display = "none";
    mark(null);
    if (!d.moving) return openPanel(d.id);
    const t = target(e.clientX, e.clientY);
    if (!t || t === d.id) return;
    try {
      await api("/api/tree/move", { nodeId: d.id, parentId: t });
      await loadForest();
    } catch (err) {
      banner(`Couldn't move it: ${err.message}`);
    }
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const box = svg.getBoundingClientRect();
    const mx = e.clientX - box.left, my = e.clientY - box.top;
    const k = Math.max(0.2, Math.min(3, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - ((mx - view.x) * k) / view.k;
    view.y = my - ((my - view.y) * k) / view.k;
    view.k = k;
    setView();
  }, { passive: false });
  svg.addEventListener("keydown", (e) => {
    const node = e.target.closest?.("[data-node]");
    if (node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(node.getAttribute("data-node")); }
  });
})();

// ---- the side panel: everything about a node, and edits -------------------------------
const LABELS = ["topic", "project", "org", "place", "person", "work", "pet", "other"];
function nodeOptions(exclude) {
  const roots = forest.roots.map((r) => `<option value="${esc(r.id)}">${esc(r.name)} (root)</option>`);
  const nodes = forest.nodes
    .filter((n) => n.id !== exclude && !n.frontier)
    .sort((a, b) => (a.root || "~").localeCompare(b.root || "~") || a.name.localeCompare(b.name))
    .map((n) => `<option value="${esc(n.id)}">${esc(n.name)}${n.parent ? ` (in ${esc(n.parent)})` : ""}</option>`);
  return roots.concat(nodes).join("");
}

async function openPanel(id) {
  selected = id;
  drawForest();
  const panel = $("#panel");
  panel.hidden = false;
  try {
    const d = await api(`/api/node/${encodeURIComponent(id)}`);
    const n = d.node;
    for (const g of document.querySelectorAll("#forest .node")) g.classList.toggle("selected", g.getAttribute("data-node") === id);
    panel.innerHTML = `
      <button class="close ghost" id="closePanel" aria-label="Close">Close</button>
      <h2>${esc(n.name)}</h2>
      <p class="status">${esc(statusLine(n))}</p>
      ${d.definition ? `<p>${esc(d.definition)}</p>` : ""}
      ${d.examples.length ? `<p class="includes"><b>Includes</b>${d.examples.map(esc).join(", ")}</p>` : ""}
      ${d.aliases.length ? `<p class="small">Also called ${d.aliases.map(esc).join(", ")}</p>` : ""}
      <h3>Facts here</h3>
      ${d.facts.length ? `<ul>${d.facts.map((f) => `<li>${esc(f.statement)}<div class="row"><select data-fact="${esc(f.id)}" aria-label="Move this fact"><option value="">Move to…</option>${nodeOptions(id)}</select></div></li>`).join("")}</ul>` : `<p class="small">None yet.</p>`}
      ${d.hypothesis ? `<h3>The guess</h3><p>Probably level ${d.hypothesis.depth}, p ${d.hypothesis.p.toFixed(2)} (${esc(d.hypothesis.kind)}).</p><p class="path">${d.hypothesis.path.map(esc).join(" → ")}</p><p class="small">${esc(d.hypothesis.reason)}</p>` : ""}
      <h3>What you've said</h3>
      ${d.history.length ? `<ul>${d.history.map((h) => `<li>${h.kind === "card" ? (h.level !== null ? `You said “${esc(LEVEL_NAME[h.level])}”` : h.rating === "wouldnt_say" ? "You said you'd rather not say" : "Asked, not answered") : `${esc(h.question)}<div class="small">an older quiz question · ${esc(h.rating ? h.rating.replace("_", " ") : "not answered")}</div>`}<div class="small">${esc(h.shownAt.slice(0, 10))}</div></li>`).join("")}</ul>` : `<p class="small">None yet.</p>`}
      <h3>Links</h3>
      ${d.links.length ? `<ul>${d.links.map((l) => `<li><span>${l.kind === "requires" ? (l.direction === "out" ? "needs" : "needed by") : "related to"} ${esc(l.other.name)}</span> <button class="ghost" data-unlink="${esc(l.id)}" aria-label="Remove this link">Remove</button></li>`).join("")}</ul>` : `<p class="small">None.</p>`}
      <h3>Edit</h3>
      <div class="row"><input id="rename" value="${esc(n.name)}" aria-label="New name"><button id="doRename">Rename</button></div>
      <div class="row"><input id="defn" value="${esc(d.definition || "")}" placeholder="One-line definition" aria-label="Definition"></div>
      <div class="row"><input id="examples" value="${esc(d.examples.join(", "))}" placeholder="What it includes, comma-separated" aria-label="What it includes"><button id="doDescribe">Save</button></div>
      <div class="row"><select id="moveTo" aria-label="New parent"><option value="">Move under…</option>${nodeOptions(id)}</select><button id="doMove">Move</button></div>
      <div class="row"><input id="childName" placeholder="New child's name" aria-label="New child's name"><select id="childLabel" aria-label="Kind">${LABELS.map((l) => `<option${l === (n.label === "other" ? "other" : n.label) ? " selected" : ""}>${l}</option>`).join("")}</select><button id="doAdd">Add child</button></div>
      <div class="row"><button id="doDelete" class="ghost" style="color:var(--danger)">Delete this node</button></div>
      <div class="error" id="panelError"></div>`;
    const fail = (e) => ($("#panelError").textContent = e.message);
    const edit = async (path, body) => {
      try {
        await api(path, body);
        await loadForest();
      } catch (e) {
        fail(e);
      }
    };
    $("#closePanel").onclick = () => { panel.hidden = true; selected = null; drawForest(); };
    $("#doRename").onclick = () => { const name = $("#rename").value.trim(); if (!name) return fail(new Error("Give it a name first.")); edit("/api/tree/rename", { nodeId: id, name }); };
    $("#doDescribe").onclick = () => edit("/api/tree/describe", { nodeId: id, definition: $("#defn").value.trim() || null, examples: $("#examples").value.split(",").map((e) => e.trim()).filter(Boolean) });
    $("#doMove").onclick = () => { const to = $("#moveTo").value; if (!to) return fail(new Error("Pick where it goes.")); edit("/api/tree/move", { nodeId: id, parentId: to }); };
    $("#doAdd").onclick = () => { const name = $("#childName").value.trim(); if (!name) return fail(new Error("Give the child a name first.")); edit("/api/tree/add", { parentId: id, name, label: $("#childLabel").value }); };
    $("#doDelete").onclick = () => {
      if (!confirm(`Delete ${n.name}? Its facts move up to its parent, and nothing re-adds it.`)) return;
      selected = null;
      panel.hidden = true;
      edit("/api/tree/delete-node", { nodeId: id });
    };
    for (const s of panel.querySelectorAll("[data-fact]")) s.onchange = () => s.value && edit("/api/fact/move", { memoryId: s.getAttribute("data-fact"), nodeId: s.value });
    for (const b of panel.querySelectorAll("[data-unlink]")) b.onclick = () => edit("/api/tree/delete-edge", { edgeId: b.getAttribute("data-unlink") });
  } catch (e) {
    panel.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

function statusLine(n) {
  const knowledge = n.root === "knowledge" || (!n.root && n.label === "topic");
  const level = (d) => `“${LEVEL_NAME[d] ?? d}”`;
  if (!knowledge) return `${n.facts} fact${n.facts === 1 ? "" : "s"} · ${n.label}${n.boundary ? " · boundary" : ""}`;
  if (n.state === "probable" && n.hypothesis) return `Guessed: probably ${level(n.hypothesis.depth)} (p ${n.hypothesis.p.toFixed(2)})`;
  if (n.state === "dark") return "You don't know it";
  if (n.depth === null) return "Not asked yet";
  if (n.via === "gap") return `A gap: fine up to ${level(n.depth)}`;
  if (n.via === "inherited") return `You know it: ${level(n.depth)}, from ${n.from}`;
  return `You know it: ${level(n.depth)} (${n.basis})${n.boundary ? " · boundary" : ""}`;
}

// ---- boundaries -----------------------------------------------------------
async function loadBoundaries() {
  const box = $("#boundaries > div");
  try {
    const { boundaries } = await api("/api/boundaries");
    box.innerHTML = boundaries.length
      ? `<p class="note">The standin deflects questions on these branches. Undo any you'd rather allow.</p><ul>${boundaries.map((b) => `<li><span>${esc(b.topic)}</span><button data-undo="${esc(b.nodeId)}">Undo</button></li>`).join("")}</ul>`
      : `<p class="empty">No boundaries. Rating a question “Wouldn't say” adds one.</p>`;
    for (const b of box.querySelectorAll("[data-undo]")) b.onclick = async () => { await api("/api/boundaries/undo", { nodeId: b.getAttribute("data-undo") }); loadBoundaries(); };
  } catch (e) {
    box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

loadCard();
</script>
</body>
